<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPRPG Fichas</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <header class="mb-4">
      <h1 class="h3">OPRPG Fichas</h1>
      <p class="text-muted">
        Gerenciador de personagens e equipamentos de Ordem Paranormal
      </p>

      <div id="alert" class="alert alert-danger d-none" role="alert"></div>
    </header>

    <div class="row g-4">
      <section class="col-lg-6">
        <div class="card">
          <div class="card-header bg-dark text-white fw-bold">
            Personagens
          </div>

          <div class="card-body">
            <form id="character-form" class="row g-2 mb-3">
              <div class="col-12">
                <input
                  type="text"
                  id="character-name"
                  class="form-control"
                  placeholder="Nome"
                  required
                />
              </div>

              <div class="col-4">
                <select
                  id="character-nex"
                  class="form-select"
                  required
                >
                  <option value="">Selecione o NEX</option>

                  <option value="5">5%</option>
                  <option value="10">10%</option>
                  <option value="15">15%</option>
                  <option value="20">20%</option>
                  <option value="25">25%</option>
                  <option value="30">30%</option>
                  <option value="35">35%</option>
                  <option value="40">40%</option>
                  <option value="45">45%</option>
                  <option value="50">50%</option>
                  <option value="55">55%</option>
                  <option value="60">60%</option>
                  <option value="65">65%</option>
                  <option value="70">70%</option>
                  <option value="75">75%</option>
                  <option value="80">80%</option>
                  <option value="85">85%</option>
                  <option value="90">90%</option>
                  <option value="95">95%</option>
                  <option value="99">99%</option>
                </select>
              </div>

              <div class="col-4">
                <select
                  id="character-origin"
                  class="form-select"
                  required
                >
                  <option value="">Selecione a origem</option>
                  <option value="Acadêmico">Acadêmico</option>
                  <option value="Agente de Saúde">Agente de Saúde</option>
                  <option value="Amnésico">Amnésico</option>
                  <option value="Artista">Artista</option>
                  <option value="Atleta">Atleta</option>
                  <option value="Chef">Chef</option>
                  <option value="Criminoso">Criminoso</option>
                  <option value="Cultista Arrependido">Cultista Arrependido</option>
                  <option value="Desgarrado">Desgarrado</option>
                  <option value="Engenheiro">Engenheiro</option>
                  <option value="Executivo">Executivo</option>
                  <option value="Investigador">Investigador</option>
                  <option value="Lutador">Lutador</option>
                  <option value="Magnata">Magnata</option>
                  <option value="Mercenário">Mercenário</option>
                  <option value="Militar">Militar</option>
                  <option value="Operário">Operário</option>
                  <option value="Policial">Policial</option>
                  <option value="Religioso">Religioso</option>
                  <option value="Servidor Público">Servidor Público</option>
                  <option value="Teórico da Conspiração">Teórico da Conspiração</option>
                  <option value="T.I.">T.I.</option>
                  <option value="Trabalhador Rural">Trabalhador Rural</option>
                  <option value="Trambiqueiro">Trambiqueiro</option>
                  <option value="Universitário">Universitário</option>
                  <option value="Vítima">Vítima</option>
                </select>
              </div>

              <div class="col-4">
                <select
                  id="character-class"
                  class="form-select"
                  required
                >
                  <option value="">Selecione a classe</option>
                  <option value="Combatente">Combatente</option>
                  <option value="Especialista">Especialista</option>
                  <option value="Ocultista">Ocultista</option>
                </select>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-dark w-100">
                  Adicionar personagem
                </button>
              </div>
            </form>

            <ul id="character-list" class="list-group"></ul>
          </div>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="card">
          <div class="card-header bg-secondary text-white fw-bold">
            Equipamentos
          </div>

          <div class="card-body">
            <form id="equipment-form" class="row g-2 mb-3">
              <div class="col-6">
                <input
                  type="text"
                  id="equipment-name"
                  class="form-control"
                  placeholder="Nome"
                  required
                />
              </div>

              <div class="col-6">
                <select
                  id="equipment-category"
                  class="form-select"
                  required
                >
                  <option value="">Selecione a categoria</option>
                  <option value="Arma Simples">Arma Simples</option>
                  <option value="Arma Tática">Arma Tática</option>
                  <option value="Arma Pesada">Arma Pesada</option>

                  <option value="Proteção Leve">Proteção Leve</option>
                  <option value="Proteção Pesada">Proteção Pesada</option>

                  <option value="Item Operacional">Item Operacional</option>

                  <option value="Item Paranormal">Item Paranormal</option>
                  <option value="Item Amaldiçoado">Item Amaldiçoado</option>
                </select>
              </div>

              <div class="col-12">
                <input
                  type="text"
                  id="equipment-description"
                  class="form-control"
                  placeholder="Descrição"
                />
              </div>

              <div class="col-12">
                <select id="equipment-character" class="form-select" required>
                  <option value="">Selecione um personagem...</option>
                </select>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-secondary w-100">
                  Adicionar equipamento
                </button>
              </div>
            </form>

            <ul id="equipment-list" class="list-group"></ul>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
